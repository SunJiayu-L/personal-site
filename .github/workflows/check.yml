name: Check website
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      BASE_PATH: /personal-site
      SITE_URL: https://sunjiayu-l.github.io
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Verify published Notion sync
        if: github.event_name == 'push'
        run: pnpm sync:notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_BLOG_SOURCE: ${{ vars.NOTION_BLOG_SOURCE || '7a4239f0-cb64-4c03-928f-f8929aea746d' }}
          NOTION_COURSES_SOURCE: ${{ vars.NOTION_COURSES_SOURCE || '6f8d883f-80e9-4cb8-a813-748f690ec5ec' }}
          NOTION_NOTES_SOURCE: ${{ vars.NOTION_NOTES_SOURCE || '3aa2722c-9cd5-43c8-aff1-3ff92950d19b' }}
          NOTION_PUBLICATIONS_SOURCE: ${{ vars.NOTION_PUBLICATIONS_SOURCE || '8c0535fc-2660-4597-8f50-103f1887d08b' }}
          NOTION_PROJECTS_SOURCE: ${{ vars.NOTION_PROJECTS_SOURCE || 'e079f4e3-e907-43a2-a2e0-f3d802678280' }}
          NOTION_LINKS_SOURCE: ${{ vars.NOTION_LINKS_SOURCE || '8784bc5f-e7a0-40f6-83e9-677ac4c6b1c3' }}
          NOTION_FRIENDS_SOURCE: ${{ vars.NOTION_FRIENDS_SOURCE || '78a4c3fb-e5b4-411b-9597-95e4e434ada7' }}
      - run: pnpm build
